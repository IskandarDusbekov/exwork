{% load narx %}{# папка қатори: дарахтда ва JS қайта қурганда (<template>) бир хил #}
    <div class="of-row">
      {% if own %}<span class="of-grip" data-grip title="Ушлаб судранг — папка ичидагилари билан бирга сурилади">{% icon "menu" "h-4 w-4" %}</span>{% endif %}
      <button type="button" class="of-toggle" data-toggle aria-expanded="true" title="Йиғиш / очиш">{% icon "chevron-down" "h-4 w-4" %}</button>
      <input type="checkbox" class="of-check" data-folder-check title="Папкадаги ҳамма сметалар"{% if not own %} disabled{% endif %}>
      <span class="text-amber-500">{% icon "folder" "h-4 w-4 shrink-0" %}</span>
      <span class="of-fname" title="{{ path }}" data-fname>{{ name }}</span>
      <span class="of-count" data-count></span>
      {% if own %}<span class="of-move">
        <button type="button" data-up title="Юқорига">{% icon "chevron-down" "h-4 w-4 rotate-180" %}</button>
        <button type="button" data-down title="Пастга">{% icon "chevron-down" "h-4 w-4" %}</button></span>{% endif %}
    </div>
