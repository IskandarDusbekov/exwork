{% load narx %}<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Нархлаш{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <style>
    .num { font-variant-numeric: tabular-nums; white-space: nowrap; }
    .busy .when-idle { display: none; }
    .when-busy { display: none; }
    .busy .when-busy { display: inline-flex; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">
  <header class="bg-white border-b border-slate-200">
    <div class="{% block header_class %}max-w-6xl mx-auto px-4{% endblock %} py-3 flex items-center gap-3">
      <a href="{% url 'index' %}" class="flex items-center gap-2 text-slate-900">
        <span class="grid h-8 w-8 place-items-center rounded-lg bg-slate-900 text-white">{% icon "logo" "h-5 w-5" %}</span>
        <span class="text-lg font-semibold tracking-tight">Нархлаш</span></a>
      {% if crumbs %}{% include "jobs/_crumbs.html" %}{% else %}<span class="hidden text-sm text-slate-400 sm:inline">смета нархлаш</span>{% endif %}
      {% block header_extra %}{% endblock %}
      <a href="{% url 'index' %}" class="ml-auto rounded-lg border border-slate-300 px-3 py-1.5 text-sm font-medium hover:bg-slate-50"><span class="inline-flex items-center gap-1.5">{% icon "upload" %} Янги юклаш</span></a>
    </div>
  </header>
  <main class="{% block main_class %}max-w-6xl mx-auto px-4 py-6{% endblock %}">
    {% block content %}{% endblock %}
  </main>
  <script>
    // Узоқ ишлайдиган формада тугмани блоклаб, «ишланяпти…» кўрсатамиз
    document.querySelectorAll("form[data-busy]").forEach(function (f) {
      f.addEventListener("submit", function () {
        f.classList.add("busy");
        // Darhol o'chirilsa, bosilgan tugmaning nomi (masalan reset_percents) formaga qo'shilmay qoladi
        setTimeout(function () {
          f.querySelectorAll("button[type=submit]").forEach(function (b) { b.disabled = true; });
        }, 0);
      });
    });
    // ички ҳавола йиғилган бўлимга (<details>) олиб борса — уни очамиз
    document.querySelectorAll('a[href^="#"]').forEach(function (a) {
      a.addEventListener("click", function () {
        var t = document.querySelector(a.getAttribute("href"));
        if (t && t.tagName === "DETAILS") t.open = true;
      });
    });
    document.querySelectorAll("input[type=range][data-out]").forEach(function (r) {
      var out = document.getElementById(r.dataset.out);
      var sync = function () { out.textContent = r.value + "%"; };
      r.addEventListener("input", sync); sync();
    });
  </script>
</body>
</html>
