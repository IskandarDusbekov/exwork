{% extends "jobs/base.html" %}
{% load narx %}
{% block title %}{{ project.name }} · Нархлаш{% endblock %}
{% block header_class %}px-4 lg:px-6{% endblock %}
{% block main_class %}{% endblock %}
{% block content %}
<div id="project-body">{% include "jobs/_project_body.html" %}</div>

<style>
  .explorer { font: 14px/1.45 "Segoe UI", system-ui, sans-serif; }
  .tree-row { display: flex; align-items: center; gap: 6px; min-height: 30px; padding: 2px 10px 2px 6px; color: #1f2937;
              cursor: pointer; white-space: nowrap; border: 1px solid transparent; }
  .tree-row:hover { background: #e8e8e8; }
  .tree-row:focus-visible { outline: none; border-color: #0b74de; }
  summary.tree-row { list-style: none; }
  summary.tree-row::-webkit-details-marker { display: none; }
  .tree-chevron { display: inline-flex; width: 18px; justify-content: center; color: #6b7280; flex-shrink: 0; transition: transform .12s; }
  details[open] > summary .tree-chevron { transform: rotate(90deg); }
  .tree-ico-open { display: none; }
  details[open] > summary .tree-ico-open { display: inline-flex; }
  details[open] > summary .tree-ico-closed { display: none; }
  .tree-name { min-width: 0; flex: 1; overflow: hidden; text-overflow: ellipsis; }
  .tree-deco { margin-left: auto; flex-shrink: 0; font-size: 12px; display: inline-flex; align-items: center; }
  .tree-children { background: linear-gradient(#dcdcdc, #dcdcdc) no-repeat; background-size: 1px 100%;
                   background-position: calc(var(--guide) + 17px) 0; }
  .tree-file .tree-name { color: #334155; }
  .tree-result { background: #f0fdf4; }
  .tree-result:hover { background: #dcfce7; }
  .tree-row.is-active { background: #dbeafe; border-color: #93c5fd; }
  .tree-btn { border-radius: 4px; padding: 2px; color: #6b7280; }
  .tree-btn:hover { background: #e5e5e5; color: #111827; }
  .part-row.is-active { background: #eff6ff; }
</style>
<script>
  (function () {
    var KEY = "narxlash-tree-{{ project.id }}";
    var body = document.getElementById("project-body");
    function closed() { try { return new Set(JSON.parse(sessionStorage.getItem(KEY) || "[]")); } catch (e) { return new Set(); } }
    function save(set) { try { sessionStorage.setItem(KEY, JSON.stringify(Array.from(set))); } catch (e) {} }

    // йиғилган папкалар саҳифа янгиланганда ҳам йиғиқ қолади
    function wire() {
      var shut = closed();
      body.querySelectorAll("details.tree-folder").forEach(function (d) {
        if (shut.has(d.dataset.path)) d.open = false;
        d.addEventListener("toggle", function () {
          var s = closed();
          if (d.open) s.delete(d.dataset.path); else s.add(d.dataset.path);
          save(s);
        });
      });
      body.querySelectorAll(".tree-btn").forEach(function (b) {
        b.addEventListener("click", function () {
          var open = b.dataset.tree === "open", s = new Set();
          body.querySelectorAll("details.tree-folder").forEach(function (d) {
            if (d.dataset.path) { d.open = open; if (!open) s.add(d.dataset.path); }
          });
          save(s);
        });
      });
      // жадвалдаги қисм устига келса — дарахтда ёритилади (ва аксинча)
      body.querySelectorAll(".part-row").forEach(function (tr) {
        var d = body.querySelector('details.tree-folder[data-path="' + CSS.escape(tr.dataset.path) + '"] > summary');
        if (!d) return;
        tr.addEventListener("mouseenter", function () { d.classList.add("is-active"); });
        tr.addEventListener("mouseleave", function () { d.classList.remove("is-active"); });
        d.addEventListener("mouseenter", function () { tr.classList.add("is-active"); });
        d.addEventListener("mouseleave", function () { tr.classList.remove("is-active"); });
      });
    }
    wire();

    // фонда ишланаётган бўлса — ҳар 2.5 сонияда янгилаймиз (скролл жойида қолади)
    function poll() {
      var st = document.getElementById("project-state");
      if (!st || st.dataset.working !== "1") return;
      setTimeout(function () {
        fetch(location.pathname + "?partial=1", {cache: "no-store"}).then(function (r) { return r.text(); }).then(function (html) {
          var tree = body.querySelector(".tree"), top = tree ? tree.scrollTop : 0;
          body.innerHTML = html;
          wire();
          var t2 = body.querySelector(".tree");
          if (t2) t2.scrollTop = top;
          poll();
        }).catch(poll);
      }, 2500);
    }
    poll();
  })();
</script>
{% endblock %}
