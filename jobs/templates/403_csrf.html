<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Саҳифа эскирган — Муҳандис лойиҳачи</title>
  {# мустақил саҳифа: сервер хатосида ҳам очилсин (CSS файл, база, шаблон тегларисиз) #}
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f8fafc; color: #1e293b;
           font: 15px/1.6 "Segoe UI", system-ui, -apple-system, sans-serif; }
    .box { max-width: 440px; margin: 24px; padding: 28px; border: 1px solid #e2e8f0; border-radius: 16px; background: #fff;
           box-shadow: 0 1px 2px rgba(15,23,42,.06); }
    .code { font-size: 13px; font-weight: 700; letter-spacing: .08em; color: #d97706; }
    h1 { margin: 6px 0 8px; font-size: 22px; color: #0f172a; }
    p { margin: 0 0 18px; color: #475569; }
    a { display: inline-block; padding: 9px 16px; border-radius: 10px; background: #0f172a; color: #fff; text-decoration: none; font-weight: 600; }
    a.ghost { margin-left: 6px; background: #fff; color: #0f172a; border: 1px solid #cbd5e1; }
  </style>
</head>
<body>
  <div class="box">
    <div class="code">ХАТО 403</div>
    <h1>Саҳифа эскирган</h1>
    <p>Форма узоқ очиқ турди ёки сессия янгиланди. Саҳифани янгилаб (F5), амални қайта бажаринг.</p>
    <a href="/">Бош саҳифа</a><a class="ghost" href="javascript:history.back()">Орқага</a>
  </div>
</body>
</html>
