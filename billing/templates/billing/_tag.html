{% load billing_tags %}{% bill_hint work as bh %}{% if bh.text %}<span class="bill-tag is-{{ bh.kind }}" title="{% if bh.kind == 'cost' %}Юклаб олишда балансдан ечилади (бир марта){% elif bh.kind == 'short' %}Балансда {{ bh.need }} сўм етмайди{% elif bh.kind == 'quota' %}Тарифдаги қаторлардан{% else %}Аввал тўланган — бепул{% endif %}" style="display:inline-block;margin-left:6px;border-radius:999px;padding:1px 8px;font-size:11px;font-weight:700;line-height:1.6;white-space:nowrap;vertical-align:middle;background:{% if bh.kind == 'short' %}#fef3c7;color:#92400e{% else %}color-mix(in srgb, currentColor 18%, transparent){% endif %}">{{ bh.text }}</span>{% endif %}
