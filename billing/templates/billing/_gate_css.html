<style>
  .bg-wrap { display: grid; place-items: center; min-height: 60vh; padding: 24px 0; }
  .bg-card { width: 100%; max-width: 520px; border: 1px solid rgb(var(--ink-200)); border-radius: 20px; background: #fff; padding: 24px; box-shadow: 0 10px 30px rgba(15, 23, 42, .06); }
  .bg-ic { display: grid; place-items: center; width: 48px; height: 48px; border-radius: 999px; }
  .bg-ic.is-pay { background: rgb(var(--ok-100)); color: rgb(var(--ok-700)); }
  .bg-ic.is-short { background: rgb(var(--warn-100)); color: rgb(var(--warn-700)); }
  .bg-card h1 { margin-top: 12px; font-size: 20px; font-weight: 800; line-height: 1.25; color: rgb(var(--ink-900)); }
  .bg-lead { margin-top: 4px; font-size: 14px; color: rgb(var(--ink-500)); }
  .bg-dl { margin-top: 16px; border-radius: 14px; background: rgb(var(--ink-50)); padding: 6px 14px; }
  .bg-dl div { display: flex; justify-content: space-between; gap: 12px; padding: 7px 0; font-size: 14px; }
  .bg-dl div + div { border-top: 1px solid rgb(var(--ink-200)); }
  .bg-dl dt { color: rgb(var(--ink-600)); } .bg-dl dd { font-weight: 600; color: rgb(var(--ink-900)); font-variant-numeric: tabular-nums; text-align: right; }
  .bg-dl .is-sum dd { font-size: 16px; font-weight: 800; }
  .bg-dl .is-need dt, .bg-dl .is-need dd { color: rgb(var(--bad-700)); font-weight: 700; }
  .bg-acts { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; margin-top: 18px; }
  .bg-btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 44px; padding: 0 18px; border-radius: 12px; font-size: 14px; font-weight: 700; }
  .bg-btn.is-main { background: rgb(var(--ok-600)); color: #fff; } .bg-btn.is-main:hover { background: rgb(var(--ok-700)); }
  .bg-btn.is-line { border: 1px solid rgb(var(--ink-300)); color: rgb(var(--ink-700)); } .bg-btn.is-line:hover { border-color: rgb(var(--ink-500)); }
  .bg-foot { margin-top: 14px; font-size: 12.5px; color: rgb(var(--ink-500)); }
  .bg-foot a { font-weight: 600; color: rgb(var(--brand-700)); text-decoration: underline; }
</style>
<script>
  // «Тасдиқлаш ва юклаб олиш» — файл юклангач, иш саҳифасига қайтиш (тасдиқлаш саҳифасида қолиб кетмасин)
  document.addEventListener("click", function (e) {
    var a = e.target.closest && e.target.closest(".bg-btn.is-main[data-then]");
    if (a) setTimeout(function () { location.href = a.dataset.then; }, 1500);
  });
</script>
