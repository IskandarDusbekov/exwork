[pytest]
# Bitta buyruq — hamma testlar: core (yadro) + accounts, jobs, panel (Django, pytest-django orqali)
DJANGO_SETTINGS_MODULE = web.settings
testpaths = core/tests accounts jobs panel resbase texnazor
python_files = test_*.py tests.py tests_*.py
markers =
    staff_2fa: panel / admin uchun ikki bosqichli kirish yoqilgan holda
    recalc_queue: smetani qayta hisoblash navbatini (fonda) tekshiradi — conftest uni darhol bajarmaydi
filterwarnings =
    ignore:Cannot parse header or footer:UserWarning
