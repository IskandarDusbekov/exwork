<style>
  /* эълон карточкаси (news/_card.html): учта услуб — янгилик (кўк), жиддий (тўқ), табрик (байрамона) */
  .nw-card { position: relative; overflow: hidden; width: 100%; border-radius: 22px; background: #fff; color: rgb(var(--ink-800)); box-shadow: 0 30px 80px rgb(15 23 42 / .28); }
  .nw-top { position: relative; display: flex; align-items: center; gap: 12px; padding: 22px 24px 46px; color: #fff; }
  .nw-ic { display: grid; place-items: center; width: 48px; height: 48px; flex-shrink: 0; border-radius: 15px; background: rgb(255 255 255 / .16); box-shadow: inset 0 0 0 1px rgb(255 255 255 / .22); }
  .nw-kind { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
  .nw-date { margin-left: auto; font-size: 12px; opacity: .8; font-variant-numeric: tabular-nums; }
  .nw-main { position: relative; margin-top: -26px; padding: 22px 24px 4px; border-radius: 22px 22px 0 0; background: #fff; }
  .nw-title { font-size: 22px; font-weight: 800; line-height: 1.25; color: rgb(var(--ink-900)); overflow-wrap: anywhere; }
  .nw-body { margin-top: 10px; display: grid; gap: 10px; font-size: 15px; line-height: 1.6; color: rgb(var(--ink-600)); overflow-wrap: anywhere; }
  .nw-body ul { display: grid; gap: 6px; padding-left: 0; list-style: none; }
  .nw-body li { position: relative; padding-left: 22px; }
  .nw-body li::before { content: ""; position: absolute; left: 4px; top: .62em; width: 7px; height: 7px; border-radius: 999px; background: var(--nw-accent); }
  .nw-acts { display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 10px; padding: 18px 24px 22px; }
  .nw-link { display: inline-flex; align-items: center; gap: 6px; margin-right: auto; font-size: 14px; font-weight: 700; color: var(--nw-accent); }
  .nw-link:hover { text-decoration: underline; }
  .nw-link[hidden] { display: none; }
  .nw-ok { height: 42px; padding: 0 22px; border-radius: 12px; background: var(--nw-btn); color: #fff; font-size: 15px; font-weight: 700; transition: filter .15s; }
  .nw-ok:hover { filter: brightness(1.1); }
  /* янгилик */
  .nw-news { --nw-accent: rgb(var(--brand-600)); --nw-btn: rgb(var(--brand-600)); }
  .nw-news .nw-top { background: linear-gradient(135deg, rgb(var(--brand-700)), rgb(var(--brand-500)) 60%, rgb(56 189 248)); }
  /* жиддий */
  .nw-serious { --nw-accent: rgb(var(--warn-600)); --nw-btn: rgb(var(--ink-900)); }
  .nw-serious .nw-top { background: rgb(var(--ink-900)); }
  .nw-serious .nw-ic { background: rgb(var(--warn-400)); color: rgb(var(--ink-900)); box-shadow: none; }
  .nw-serious .nw-main { border-top: 4px solid rgb(var(--warn-400)); }
  /* табрик */
  .nw-celebrate { --nw-accent: rgb(219 39 119); --nw-btn: linear-gradient(135deg, rgb(219 39 119), rgb(245 158 11)); }
  .nw-celebrate .nw-ok { background: var(--nw-btn); }
  .nw-celebrate .nw-top { background: linear-gradient(120deg, rgb(124 58 237), rgb(219 39 119) 50%, rgb(245 158 11)); }
  .nw-celebrate .nw-top::after { content: ""; position: absolute; inset: 0; opacity: .35; pointer-events: none;
    background-image: radial-gradient(circle, #fff 1.5px, transparent 2px), radial-gradient(circle, #fde68a 1.5px, transparent 2px);
    background-size: 38px 38px, 52px 52px; background-position: 0 0, 19px 23px; }
  .nw-celebrate .nw-title { background: linear-gradient(90deg, rgb(124 58 237), rgb(219 39 119)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  /* ойна */
  dialog.nw-dlg { width: min(560px, calc(100vw - 32px)); max-height: calc(100vh - 32px); padding: 0; border: 0; background: transparent; overflow: visible; }
  dialog.nw-dlg::backdrop { background: rgb(15 23 42 / .55); backdrop-filter: blur(3px); }
  dialog.nw-dlg[open] .nw-card { animation: nw-in .35s cubic-bezier(.2, .9, .3, 1.2); }
  dialog.nw-dlg .nw-card { max-height: calc(100vh - 32px); overflow-y: auto; }
  .nw-x { position: absolute; right: 12px; top: 12px; z-index: 2; display: grid; place-items: center; width: 34px; height: 34px; border-radius: 10px; color: #fff; background: rgb(255 255 255 / .14); }
  .nw-x:hover { background: rgb(255 255 255 / .28); }
  @keyframes nw-in { from { opacity: 0; transform: translateY(18px) scale(.96); } to { opacity: 1; transform: none; } }
  .nw-confetti { position: fixed; inset: 0; z-index: 2147483000; pointer-events: none; overflow: hidden; }
  .nw-confetti i { position: absolute; top: -12px; width: 9px; height: 14px; border-radius: 2px; animation: nw-fall linear forwards; }
  @keyframes nw-fall { to { transform: translate3d(var(--dx), 105vh, 0) rotate(var(--r)); opacity: .9; } }
  @media (prefers-reduced-motion: reduce) { dialog.nw-dlg[open] .nw-card { animation: none; } .nw-confetti { display: none; } }
  @media (max-width: 480px) { .nw-title { font-size: 19px; } .nw-top { padding: 18px 18px 42px; } .nw-main, .nw-acts { padding-left: 18px; padding-right: 18px; } }
</style>
