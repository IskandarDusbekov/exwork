{% if page.has_other_pages %}
<nav class="mt-4 flex items-center justify-center gap-2 text-sm" aria-label="Саҳифалар">
  {% if page.has_previous %}<a href="?{% for k, v in request.GET.items %}{% if k != 'page' %}{{ k|urlencode }}={{ v|urlencode }}&{% endif %}{% endfor %}page={{ page.previous_page_number }}" class="rounded-lg border border-slate-200 bg-white px-3 py-1.5 hover:bg-slate-50">← Олдинги</a>{% endif %}
  <span class="num text-slate-500">{{ page.number }} / {{ page.paginator.num_pages }}</span>
  {% if page.has_next %}<a href="?{% for k, v in request.GET.items %}{% if k != 'page' %}{{ k|urlencode }}={{ v|urlencode }}&{% endif %}{% endfor %}page={{ page.next_page_number }}" class="rounded-lg border border-slate-200 bg-white px-3 py-1.5 hover:bg-slate-50">Кейинги →</a>{% endif %}
</nav>
{% endif %}
