{% load narx %}{# чап меню банди: key, url, ic, label, badge #}
<a href="{% url url %}" class="flex shrink-0 items-center gap-3 whitespace-nowrap rounded-lg px-3 py-2 font-medium transition-colors {% if tab == key %}bg-white text-slate-900{% else %}text-slate-300 hover:bg-white/5 hover:text-white{% endif %}"{% if tab == key %} aria-current="page"{% endif %}>
  {% icon ic "h-4 w-4 shrink-0" %}<span class="flex-1">{{ label }}</span>
  {% if badge %}<span class="num inline-flex items-center gap-1 rounded-full {% if tab == key %}bg-sky-100 text-sky-700{% else %}bg-sky-500/20 text-sky-300{% endif %} px-1.5 text-xs"><span class="h-1.5 w-1.5 animate-pulse rounded-full bg-sky-400"></span>{{ badge }}</span>{% endif %}
</a>
