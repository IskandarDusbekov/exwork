{% if page.has_other_pages %}
<div class="bl-pg">
  {% if page.has_previous %}<a href="?{% for k, v in request.GET.items %}{% if k != 'page' %}{{ k }}={{ v|urlencode }}&{% endif %}{% endfor %}page={{ page.previous_page_number }}">← Янгилари</a>{% else %}<span></span>{% endif %}
  <span class="text-slate-500">{{ page.number }} / {{ page.paginator.num_pages }} · {{ page.paginator.count }} та</span>
  {% if page.has_next %}<a href="?{% for k, v in request.GET.items %}{% if k != 'page' %}{{ k }}={{ v|urlencode }}&{% endif %}{% endfor %}page={{ page.next_page_number }}">Эскилари →</a>{% else %}<span></span>{% endif %}
</div>
{% endif %}
