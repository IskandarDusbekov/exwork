  /* жадвал ўз ичида айланади: сарлавҳа доим кўриниб туради, пастдаги горизонтал айлантиргич ҳам экранда */
  /* overflow-anchor: none — жадвал жойида туришини JS ўзи таъминлайди (keep); overscroll — жадвал охирида саҳифа сакрамасин */
