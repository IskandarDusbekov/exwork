{% load narx %}{# икки босқичли тасдиқлаш: 1) нима бўлишини ўқиш, 2) тасдиқлаш сўзини ёзиш. Тугма: data-confirm2 + data-* (пастда) #}
<div id="tn-c2" class="fixed inset-0 z-50 hidden items-center justify-center bg-slate-900/45 p-4" role="dialog" aria-modal="true" aria-labelledby="tn-c2-t">
  <div class="w-full max-w-md rounded-xl bg-white shadow-2xl">
    <div class="flex items-center gap-3 border-b border-slate-200 px-5 py-4">
      <span class="grid h-9 w-9 shrink-0 place-items-center rounded-full bg-rose-100 text-rose-700">{% icon "alert" "h-5 w-5" %}</span>
      <div class="min-w-0"><h3 id="tn-c2-t" class="font-semibold text-slate-900"></h3>
        <p class="text-xs text-slate-500"><span id="tn-c2-step">1</span>-қадам, 2 тадан</p></div>
    </div>
    <div class="px-5 py-4 text-sm">
      <div id="tn-c2-s1">
        <p id="tn-c2-msg" class="leading-relaxed text-slate-700"></p>
        <ul id="tn-c2-list" class="mt-3 space-y-1 rounded-lg bg-slate-50 px-4 py-3 text-slate-700"></ul>
        <p class="mt-3 font-medium text-rose-700" id="tn-c2-warn"></p>
      </div>
      <div id="tn-c2-s2" class="hidden">
        <label class="block"><span class="text-slate-700">Тасдиқлаш учун <b id="tn-c2-word" class="select-all rounded bg-rose-50 px-1.5 py-0.5 font-semibold text-rose-800"></b> деб ёзинг:</span>
          <input id="tn-c2-in" autocomplete="off" class="mt-2 w-full rounded-lg border border-slate-300 px-3 py-2 text-base focus:border-rose-600 focus:outline-none focus:ring-2 focus:ring-rose-200"></label>
        <p id="tn-c2-err" class="mt-2 hidden rounded-lg bg-rose-50 px-3 py-2 text-rose-800" role="alert"></p>
      </div>
    </div>
    <div class="flex justify-end gap-2 border-t border-slate-200 px-5 py-3">
      <button type="button" id="tn-c2-no" class="rounded-lg border border-slate-300 px-4 py-2 text-sm font-medium hover:bg-slate-50">Бекор қилиш</button>
      <button type="button" id="tn-c2-next" class="rounded-lg bg-slate-900 px-4 py-2 text-sm font-semibold text-white hover:bg-slate-700">Давом этиш →</button>
      <button type="button" id="tn-c2-ok" class="hidden rounded-lg bg-rose-700 px-4 py-2 text-sm font-semibold text-white hover:bg-rose-800 disabled:cursor-not-allowed disabled:opacity-40" disabled></button>
    </div>
  </div>
</div>
<script>
  // window.tnConfirm2({title, msg, list: [...], warn, word, ok}) -> Promise: тасдиқланса ёзилган сўз, йўқса null
  (function () {
    var box = document.getElementById("tn-c2"), $ = function (id) { return document.getElementById(id); }, done = null, want = "";
    var norm = function (s) { return String(s || "").toUpperCase().replace(/Ё/g, "Е").split(/\s+/).filter(Boolean).join(" "); };
    function step(n) {
      $("tn-c2-step").textContent = n;
      $("tn-c2-s1").classList.toggle("hidden", n !== 1); $("tn-c2-next").classList.toggle("hidden", n !== 1);
      $("tn-c2-s2").classList.toggle("hidden", n !== 2); $("tn-c2-ok").classList.toggle("hidden", n !== 2);
      if (n === 2) { $("tn-c2-in").value = ""; $("tn-c2-ok").disabled = true; $("tn-c2-in").focus(); }
    }
    function close(v) { box.classList.add("hidden"); box.classList.remove("flex"); if (done) { var d = done; done = null; d(v); } }
    window.tnConfirm2 = function (o) {
      $("tn-c2-t").textContent = o.title; $("tn-c2-msg").textContent = o.msg || "";
      $("tn-c2-list").innerHTML = ""; (o.list || []).forEach(function (t) { var li = document.createElement("li"); li.textContent = "• " + t; $("tn-c2-list").appendChild(li); });
      $("tn-c2-list").classList.toggle("hidden", !(o.list || []).length);
      $("tn-c2-warn").textContent = o.warn || ""; $("tn-c2-word").textContent = want = o.word; $("tn-c2-ok").textContent = o.ok || "Тасдиқлаш";
      $("tn-c2-err").classList.add("hidden");
      box.classList.remove("hidden"); box.classList.add("flex"); step(1); $("tn-c2-next").focus();
      return new Promise(function (resolve) { done = resolve; });
    };
    window.tnConfirm2Error = function (text) { $("tn-c2-err").textContent = text; $("tn-c2-err").classList.remove("hidden"); };
    $("tn-c2-next").addEventListener("click", function () { step(2); });
    $("tn-c2-no").addEventListener("click", function () { close(null); });
    box.addEventListener("click", function (e) { if (e.target === box) close(null); });
    document.addEventListener("keydown", function (e) { if (e.key === "Escape" && done) close(null); });
    $("tn-c2-in").addEventListener("input", function () { $("tn-c2-ok").disabled = norm(this.value) !== norm(want); });
    $("tn-c2-in").addEventListener("keydown", function (e) { if (e.key === "Enter" && !$("tn-c2-ok").disabled) $("tn-c2-ok").click(); });
    $("tn-c2-ok").addEventListener("click", function () { close($("tn-c2-in").value); });

    // формага боғланган тугмалар: <form ...><input type="hidden" name="confirm"><button type="button" data-confirm2 data-title=… data-list="a|b">
    document.querySelectorAll("[data-confirm2]").forEach(function (b) {
      b.addEventListener("click", function () {
        window.tnConfirm2({title: b.dataset.title, msg: b.dataset.msg, list: (b.dataset.list || "").split("|").filter(Boolean),
                           warn: b.dataset.warn, word: b.dataset.word, ok: b.dataset.ok}).then(function (v) {
          if (v === null) return;
          var f = b.closest("form"); f.querySelector("[name=confirm]").value = v; f.submit();
        });
      });
    });
  })();
</script>
