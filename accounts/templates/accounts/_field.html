<div class="f{% if field.errors %} has-err{% endif %}">
  <label class="f-l" for="{{ field.id_for_label }}"><span>{{ field.label }}</span>{% if extra_url %}<a href="{{ extra_url }}">{{ extra_text }}</a>{% endif %}</label>
  {{ field }}
  {% for e in field.errors %}<p class="f-e">{{ e }}</p>{% endfor %}
  {% if hint %}<p class="f-h">{{ hint }}</p>{% endif %}
</div>
