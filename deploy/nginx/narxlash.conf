# /etc/nginx/sites-available/narxlash  →  ln -s ../sites-available/narxlash /etc/nginx/sites-enabled/
# Tartib (README → 7): avval sertifikat (sudo certbot certonly --nginx -d mloyihachi.uz -d www.mloyihachi.uz), keyin bu fayl —
# sertifikat fayllari bo'lmasa nginx -t xato beradi va serverdagi BOSHQA saytlar ham qayta yuklanmaydi.
# Domen: mloyihachi.uz (+ www). Boshqa domen bo'lsa: sudo sed -i 's/mloyihachi\.uz/DOMEN/g' /etc/nginx/sites-available/narxlash

# So'rovlar chegarasi (bitta IP): kirish / ro'yxatdan o'tish / parol tiklash — daqiqasiga 10 ta (parol terib
# ko'rishga qarshi; Django ham email va IP bo'yicha cheklaydi), qolgan sahifalar — soniyasiga 20 ta (sahifa jadvali
# bo'laklarda yuklanadi, holat har 1–3 soniyada so'raladi — burst shuning uchun katta). Oshsa — 429.
limit_req_zone $binary_remote_addr zone=narxlash_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=narxlash_app:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=narxlash_conn:10m;

upstream narxlash_app {
    server 127.0.0.1:8000;
}

server {
    listen 80;
    listen [::]:80;
    server_name mloyihachi.uz www.mloyihachi.uz;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    # «listen … http2» — har qanday nginx'da ishlaydi; «http2 on;» faqat 1.25.1+ da (Ubuntu 24.04 da 1.24 —
    # «unknown directive "http2"»). Yangi nginx'da faqat ogohlantirish beradi, xato emas.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mloyihachi.uz www.mloyihachi.uz;

    ssl_certificate /etc/letsencrypt/live/mloyihachi.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mloyihachi.uz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    server_tokens off;  # xato sahifalarida nginx versiyasi ko'rinmasin
    limit_req_status 429;
    limit_conn_status 429;
    limit_conn narxlash_conn 40;  # bitta IP dan bir vaqtda ochiq ulanishlar

    # butun papka / ZIP / RAR arxiv yuklanadi (sayt chegarasi — 700 MB arxiv)
    client_max_body_size 800m;
    client_body_timeout 300s;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # siqish: smeta sahifasi (minglab qator) ~10 barobar kichrayadi; Ubuntu'da standart faqat text/html siqiladi
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # CSS va admin fayllari — to'g'ridan-to'g'ri diskdan (collectstatic)
    location /static/ {
        alias /srv/narxlash/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
    # media/ (yuklangan smetalar) BU YERDA YO'Q — fayllar faqat sayt orqali, egasining huquqi tekshirilib beriladi

    location ~ ^/(login|register|password/reset)/ {
        limit_req zone=narxlash_auth burst=10 nodelay;
        proxy_pass http://narxlash_app;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    location / {
        limit_req zone=narxlash_app burst=100 nodelay;
        proxy_pass http://narxlash_app;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;  # .env: NARXLASH_TRUST_PROXY=1
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}
