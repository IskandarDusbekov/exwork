# /etc/nginx/sites-available/narxlash  →  ln -s ../sites-available/narxlash /etc/nginx/sites-enabled/
# Tartib (README → 7): avval sertifikat (sudo certbot certonly --nginx -d DOMEN), keyin bu fayl —
# sertifikat fayllari bo'lmasa nginx -t xato beradi va serverdagi BOSHQA saytlar ham qayta yuklanmaydi.
# narxlash.uz ni o'z domeningizga almashtiring: sudo sed -i 's/narxlash\.uz/DOMEN/g' /etc/nginx/sites-available/narxlash

upstream narxlash_app {
    server 127.0.0.1:8000;
}

server {
    listen 80;
    listen [::]:80;
    server_name narxlash.uz;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name narxlash.uz;

    ssl_certificate /etc/letsencrypt/live/narxlash.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/narxlash.uz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    # butun papka / ZIP / RAR arxiv yuklanadi (sayt chegarasi — 700 MB arxiv)
    client_max_body_size 800m;
    client_body_timeout 300s;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # CSS va admin fayllari — to'g'ridan-to'g'ri diskdan (collectstatic)
    location /static/ {
        alias /srv/narxlash/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
    # media/ (yuklangan smetalar) BU YERDA YO'Q — fayllar faqat sayt orqali, egasining huquqi tekshirilib beriladi

    location / {
        proxy_pass http://narxlash_app;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;  # .env: NARXLASH_TRUST_PROXY=1
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}
